[package]
name = "ytls-util"
version = "0.0.4"
edition = "2021"
description = "yolox TLS util types"
homepage = "https://github.com/yolotls/yolotls"
keywords = ["io", "uring", "epoll", "async"]
license = "Apache-2.0/MIT"
readme = "README.md"
repository = "https://github.com/yolotls/yolotls"
categories = ["science"]

[dev-dependencies]
rstest = "0.27"
hex-literal = "1.1"
insta = "1.45"
criterion = "0.8"
hkdf = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }

[features]
default = []
zeroize = ["crypto-bigint/zeroize"]
std = []

[dependencies]
crypto-bigint = { version = "0.7", default-features = false }

[package.metadata.docs.rs]
features = []

[[bench]]
name = "bencher"
harness = false

[package]
name = "ytls-fuzz"
version = "0.0.1"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
getopts = "0.2"
ytls-record = { path = "../record" }
ytls-traits = { path = "../traits" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

#[[bin]]
#name = "record_parser"
#path = "fuzz_targets/record_parser.rs"
#test = false
#doc = false

[[bin]]
name = "record_b_server_certificate"
path = "fuzz_targets/record_b_server_certificate.rs"
test = false
doc = false
